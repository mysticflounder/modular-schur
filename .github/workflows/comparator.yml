name: comparator

# Zulip auditability gate for the AI-authored modular-Schur headline results.
#
# The Lean package lives in lean/ (lean/lakefile.toml registers the Challenge and
# Solution comparator libraries with srcDir = comparator).
#
# Two jobs:
#   conformance — VALIDATED locally. Builds the structural project modules + the
#                 two comparator modules (Challenge, Solution) and runs
#                 lean/comparator/check-conformance.sh: both build, and no
#                 Solution theorem depends on sorryAx or native_decide
#                 (legacy Lean.ofReduce* or current generated native axioms).
#                 That script is a blocklist, not a whitelist —
#                 a project-defined axiom would pass it. Statement identity AND
#                 the permitted_axioms subset are enforced by the comparator job.
#   comparator  — the authoritative leanprover/comparator run: statement identity
#                 + axiom compliance + nanoda and Lean default-kernel re-check,
#                 ending in "Your solution is okay!". The comparator is checked
#                 out at the TAG matching lean/lean-toolchain, so its bundled
#                 lean4export is built against the same Lean as the project.

on:
  push:
    branches: [master, main]
    paths:
      - 'lean/comparator/**'
      - 'lean/ModularSchur/**'
      - 'lean/ModularSchur.lean'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/lean-toolchain'
      - '.github/workflows/comparator.yml'
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    name: conformance + axiom audit (validated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      - name: Install elan (Lean toolchain manager)
        run: |
          set -euo pipefail
          # Pinned elan release v4.2.3 (published 2026-06-08), asset
          # elan-x86_64-unknown-linux-gnu.tar.gz. The elan release publishes no
          # checksum file, so this SHA-256 was computed locally with
          # `shasum -a 256` on the asset downloaded 2026-08-24.
          ELAN_VERSION=v4.2.3
          ELAN_ASSET=elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_SHA256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          curl -sSfL -o "$ELAN_ASSET" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/$ELAN_ASSET"
          echo "$ELAN_SHA256  $ELAN_ASSET" | sha256sum -c -
          tar xzf "$ELAN_ASSET"
          ./elan-init -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print pinned dependency versions
        # The literals here must match the pins used by this job's steps
        # (actions/checkout, ELAN_* in the Install elan step).
        run: |
          echo "actions/checkout: 11d5960a326750d5838078e36cf38b85af677262 (v4 = v4.4.0)"
          echo "elan: v4.2.3 elan-x86_64-unknown-linux-gnu.tar.gz sha256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
          echo "lean-toolchain: $(cat lean/lean-toolchain)"
          echo "lean --version: $(cd lean && lean --version)"

      - name: Fetch mathlib build cache
        working-directory: lean
        run: lake exe cache get

      - name: Build structural project + comparator modules, run axiom audit
        # check-conformance.sh builds only the structural modules imported by
        # Challenge/Solution, not the native_decide scan tree, and checks each
        # Solution theorem is axiom-clean.
        run: lean/comparator/check-conformance.sh

  comparator:
    name: leanprover/comparator (nanoda + default kernel)
    runs-on: ubuntu-24.04
    # Tag-pinned to the project's lean-toolchain. Blocking: this job was held
    # non-blocking only until a first green CI run confirmed the real-landrun
    # sandbox and the nanoda + Lean default kernel legs on a runner — first
    # public green run 30211804373 (2026-07-26); current public green run
    # 32621310205 (commit cf59f78, 2026-08-23).
    # A failure here is either a real regression in the 12 gated theorems or
    # drift in one of the pinned tool revisions below — both worth stopping for.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      - name: Install elan
        run: |
          set -euo pipefail
          # Pinned elan release v4.2.3 (published 2026-06-08), asset
          # elan-x86_64-unknown-linux-gnu.tar.gz. The elan release publishes no
          # checksum file, so this SHA-256 was computed locally with
          # `shasum -a 256` on the asset downloaded 2026-08-24.
          ELAN_VERSION=v4.2.3
          ELAN_ASSET=elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_SHA256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          curl -sSfL -o "$ELAN_ASSET" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/$ELAN_ASSET"
          echo "$ELAN_SHA256  $ELAN_ASSET" | sha256sum -c -
          tar xzf "$ELAN_ASSET"
          ./elan-init -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print pinned dependency versions
        # The literals here must match the pins used by this job's steps
        # (actions/checkout, ELAN_* in the Install elan step,
        # dtolnay/rust-toolchain, and the tool SHAs in the build step).
        run: |
          echo "actions/checkout: 11d5960a326750d5838078e36cf38b85af677262 (v4 = v4.4.0)"
          echo "dtolnay/rust-toolchain: 4360b52568e2003a75bf9bc1d59f33a8e3fc893c (stable, resolved 2026-08-24)"
          echo "leanprover/comparator pinned commit (CMP_SHA): 3927ad383f208ae977c340a91c48ac9b497d2097 (tag v4.33.0)"
          echo "leanprover/lean4export comparator dependency: 15f6055e299ad5b89345e533cc2192f4cc00f659"
          echo "Zouuup/landrun pinned commit: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4 (main, resolved 2026-08-25)"
          echo "ammkrn/nanoda_lib pinned commit: 05055695879dfebb6628a67da88ceca6cd6b0421 (master, resolved 2026-08-25)"
          echo "elan: v4.2.3 elan-x86_64-unknown-linux-gnu.tar.gz sha256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
          echo "lean-toolchain: $(cat lean/lean-toolchain)"
          echo "lean --version: $(cd lean && lean --version)"

      - name: Fetch mathlib build cache
        working-directory: lean
        run: lake exe cache get

      - name: Pre-build structural project + comparator modules
        # A pre-built .lake means the comparator does not rebuild Solution.lean,
        # so its guarantee no longer rests on landrun's sandbox.
        working-directory: lean
        run: lake build Challenge Solution

      - name: Install Rust (for nanoda)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, resolved 2026-08-24

      - name: Build landrun, comparator (+ matched lean4export), and nanoda
        run: |
          set -euo pipefail
          # This comparator tag (= lean-toolchain) accepts explicit
          # COMPARATOR_LANDRUN / COMPARATOR_LEAN4EXPORT / COMPARATOR_NANODA
          # overrides. This job instead puts each pinned binary on PATH.
          # Clone tools under RUNNER_TEMP so the clone does not collide with this
          # repo's own lean/comparator/ directory.
          # landrun keeps no Go files at its root and several packages under
          # ./..., so `-o <file>` is only legal against the main package path.
          # Comparator v4.33.0 requires landrun from main. Keep the resolved
          # revision immutable so a later landrun change cannot alter the gate.
          git clone https://github.com/Zouuup/landrun "$RUNNER_TEMP/landrun"
          git -C "$RUNNER_TEMP/landrun" checkout 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          ( cd "$RUNNER_TEMP/landrun" && go build -o landrun ./cmd/landrun )
          echo "$RUNNER_TEMP/landrun" >> "$GITHUB_PATH"
          # comparator AT THE TAG matching this repo's lean-toolchain, so its
          # bundled lean4export builds against the SAME Lean as the project.
          TC="$(cut -d: -f2 lean/lean-toolchain)"
          git clone --branch "$TC" https://github.com/leanprover/comparator "$RUNNER_TEMP/cmp"
          # The tag is mutable; the pin is the commit. v4.33.0 ==
          # 3927ad383f208ae977c340a91c48ac9b497d2097 — update together with
          # lean/lean-toolchain.
          CMP_SHA=3927ad383f208ae977c340a91c48ac9b497d2097
          [ "$(git -C "$RUNNER_TEMP/cmp" rev-parse HEAD)" = "$CMP_SHA" ] || {
            echo "comparator tag $TC does not point at pinned commit $CMP_SHA" >&2
            exit 1
          }
          LEAN4EXPORT_SHA=15f6055e299ad5b89345e533cc2192f4cc00f659
          ACTUAL_LEAN4EXPORT_SHA="$(
            jq -r '.packages[] | select(.name == "lean4export") | .rev' \
              "$RUNNER_TEMP/cmp/lake-manifest.json"
          )"
          [ "$ACTUAL_LEAN4EXPORT_SHA" = "$LEAN4EXPORT_SHA" ] || {
            echo "comparator lean4export dependency is $ACTUAL_LEAN4EXPORT_SHA, expected $LEAN4EXPORT_SHA" >&2
            exit 1
          }
          ( cd "$RUNNER_TEMP/cmp" && lake build && lake build lean4export )
          echo "COMPARATOR_BIN=$RUNNER_TEMP/cmp/.lake/build/bin/comparator" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cmp/.lake/packages/lean4export/.lake/build/bin" >> "$GITHUB_PATH"
          # nanoda kernel (optional second kernel; config enable_nanoda = true).
          # Comparator v4.33.0 requires a recent nanoda checkout. Pin the
          # resolved master revision and validate it by replaying every theorem.
          git clone https://github.com/ammkrn/nanoda_lib "$RUNNER_TEMP/nanoda"
          git -C "$RUNNER_TEMP/nanoda" checkout 05055695879dfebb6628a67da88ceca6cd6b0421
          ( cd "$RUNNER_TEMP/nanoda" && cargo build --release )
          echo "$RUNNER_TEMP/nanoda/target/release" >> "$GITHUB_PATH"

      - name: Run comparator on the 12 headline theorems
        working-directory: lean
        run: |
          set -euo pipefail
          # Invoked from lean/ so `lake env` resolves Challenge/Solution.
          lake env "$COMPARATOR_BIN" comparator/config.json
          # Success ends with "Your solution is okay!".
