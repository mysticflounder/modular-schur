name: comparator

# Zulip auditability gate for the AI-authored modular-Schur headline results.
#
# The Lean package lives in lean/ (lean/lakefile.toml registers the Challenge and
# Solution comparator libraries with srcDir = comparator).
#
# Two jobs:
#   conformance — VALIDATED locally. Builds the structural project modules + the
#                 two comparator modules (Challenge, Solution) and runs
#                 lean/comparator/check-conformance.sh: both build, and no
#                 Solution theorem depends on sorryAx or native_decide
#                 (legacy Lean.ofReduce* or current generated native axioms).
#                 It also builds ModularSchur.PublicAxiomAudit so the broader
#                 project-only capstone closures are emitted in the CI log.
#                 That script is a blocklist, not a whitelist —
#                 a project-defined axiom would pass it. Statement identity AND
#                 the permitted_axioms subset are enforced by the comparator job.
#   comparator  — the authoritative `lake comparator` run, with the comparator
#                 that ships in lean/lean-toolchain (Lean v4.35.0-rc2 or later
#                 bundles it): statement identity + axiom compliance + replay
#                 through Lean's kernel and the toolchain's bundled nanoda and
#                 con-ron kernels. It builds and exports Challenge and Solution
#                 inside its own bubblewrap sandbox. Nothing that judges is
#                 built from a separate pin; this follows the Palomar Registry's
#                 PalomarTemplate scripts/verify-comparator.sh
#                 (@ 2891de4c48955af824969a263d31b25e7a9a1406).

on:
  push:
    branches: [master, main]
    paths:
      - 'lean/comparator/**'
      - 'lean/ModularSchur/**'
      - 'lean/ModularSchur.lean'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/lean-toolchain'
      - '.github/workflows/comparator.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance + axiom audit (validated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      - name: Install elan (Lean toolchain manager)
        run: |
          set -euo pipefail
          # Pinned elan release v4.2.3 (published 2026-06-08), asset
          # elan-x86_64-unknown-linux-gnu.tar.gz. The elan release publishes no
          # checksum file, so this SHA-256 was computed locally with
          # `shasum -a 256` on the asset downloaded 2026-08-24.
          ELAN_VERSION=v4.2.3
          ELAN_ASSET=elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_SHA256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          curl -sSfL -o "$ELAN_ASSET" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/$ELAN_ASSET"
          echo "$ELAN_SHA256  $ELAN_ASSET" | sha256sum -c -
          tar xzf "$ELAN_ASSET"
          ./elan-init -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Print pinned dependency versions
        # The literals here must match the pins used by this job's steps
        # (actions/checkout, ELAN_* in the Install elan step).
        run: |
          echo "actions/checkout: 11d5960a326750d5838078e36cf38b85af677262 (v4 = v4.4.0)"
          echo "elan: v4.2.3 elan-x86_64-unknown-linux-gnu.tar.gz sha256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
          echo "lean-toolchain: $(cat lean/lean-toolchain)"
          echo "lean --version: $(cd lean && lean --version)"

      - name: Fetch mathlib build cache
        working-directory: lean
        run: lake exe cache get

      - name: Build structural project + comparator modules, run axiom audit
        # check-conformance.sh builds only the structural modules imported by
        # Challenge/Solution, not the native_decide scan tree, and checks each
        # Solution theorem is axiom-clean.
        run: lean/comparator/check-conformance.sh

      - name: Build public project axiom audit
        # This standalone module prints the transitive axiom closures of the
        # broader public project-only capstones; it is outside the 13-declaration
        # independent ComparatorClaims registry.
        working-directory: lean
        run: lake build ModularSchur.PublicAxiomAudit

  comparator:
    name: lake comparator (Lean kernel + nanoda + con-ron)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Blocking. A failure here is either a real regression in the 13 gated
    # ComparatorClaims declarations or a change in the toolchain named by
    # lean/lean-toolchain — both worth stopping for.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      - name: Install elan
        run: |
          set -euo pipefail
          # Pinned elan release v4.2.3 (published 2026-06-08), asset
          # elan-x86_64-unknown-linux-gnu.tar.gz. The elan release publishes no
          # checksum file, so this SHA-256 was computed locally with
          # `shasum -a 256` on the asset downloaded 2026-08-24.
          ELAN_VERSION=v4.2.3
          ELAN_ASSET=elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_SHA256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          curl -sSfL -o "$ELAN_ASSET" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/$ELAN_ASSET"
          echo "$ELAN_SHA256  $ELAN_ASSET" | sha256sum -c -
          tar xzf "$ELAN_ASSET"
          ./elan-init -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install bubblewrap for lake comparator's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which `bwrap` needs for the sandbox; the runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Print pinned dependency versions
        # The literals here must match the pins used by this job's steps
        # (actions/checkout, ELAN_* in the Install elan step). The comparator,
        # the exporter and every kernel come from lean/lean-toolchain.
        run: |
          echo "actions/checkout: 11d5960a326750d5838078e36cf38b85af677262 (v4 = v4.4.0)"
          echo "elan: v4.2.3 elan-x86_64-unknown-linux-gnu.tar.gz sha256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
          echo "lean-toolchain: $(cat lean/lean-toolchain)"
          echo "lean --version: $(cd lean && lean --version)"
          echo "bwrap --version: $(bwrap --version)"

      - name: Fetch mathlib build cache
        working-directory: lean
        run: lake exe cache get

      - name: Run lake comparator on the 13 ComparatorClaims declarations
        working-directory: lean
        run: |
          set -euo pipefail
          # Invoked from lean/, the Lake project that holds Challenge/Solution.
          prefix="$(lean --print-prefix)"
          for tool in leanexport leanchecker nanoda_bin con-ron; do
            if [ ! -x "$prefix/bin/$tool" ]; then
              echo "error: toolchain $(cat lean-toolchain) does not bundle $tool" >&2
              exit 1
            fi
          done
          # Palomar rejects `external_kernels` in a submitted comparator config
          # and registers the toolchain's bundled kernels itself; lake comparator
          # refuses `enable_nanoda` together with `external_kernels`. Judge with
          # a generated copy that does the same as Palomar.
          if jq -e 'has("external_kernels")' comparator/config.json >/dev/null; then
            echo "error: comparator/config.json must not set external_kernels" >&2
            exit 1
          fi
          config="$RUNNER_TEMP/comparator-config.json"
          jq --arg prefix "$prefix" \
            'del(.enable_nanoda)
             | .external_kernels = {
                 "nanoda": [($prefix + "/bin/nanoda_bin")],
                 "con-ron": [($prefix + "/bin/con-ron")]
               }' \
            comparator/config.json > "$config"
          lake comparator --config "$config"
          # Exit 0 is acceptance; the log ends with "Your solution is okay!".
