# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Cost and token totals were not logged during the work and are recorded as
# "not recorded" rather than estimated.

version: "v0.4"

# project - the formalization itself (not the source).
project:
  name: "schur-numbers"                              # [required]
  description: >
    Lean 4 formalization of modular Schur numbers. For m ≥ 2 and ℓ ≥ 2, put
    n = m/gcd(m,ℓ-1). The main result proves the uniform closed form
    S_m(k,ℓ) = n-1 for every k ≥ n-1. The development also proves the residue
    formulation, universal and local obstructions, the exact k=1 formula for
    2 ≤ ℓ ≤ m, and kernel-audited canonical-cover and critical-core reductions.
    Twelve Mathlib-only headline statements are checked by the Palomar
    Comparator configuration; the additional public project layer is audited
    separately and is explicitly outside that statement-comparison gate.
  authors: ["Adam McKenna"]                          # [required]
  responsible_maintainers: ["Adam McKenna"]          # [required by Palomar]
  license: "Apache-2.0"                              # [required]
  repo: "https://github.com/mysticflounder/modular-schur"   # [required] canonical PUBLIC repo, and the Palomar submission target

# Palomar submission is NOT YET COMPLETE. Select and submit an immutable
# 40-character public commit SHA only after the candidate commit exists and its
# current registry-layout and CI checks pass. A snapshot cannot reliably name
# its own Git object, so the selected SHA belongs in the submission record and
# release handoff rather than this file.

# This public repository contains the substantive Lean source. Omitting a
# repository block is the v0.4 spelling for a substantive development.
classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["05D10", "11B13", "11B75", "68V20"]

# sources - what was formalized / extended.
sources:                                             # [required]
  - title: "A uniform closed form for modular Schur numbers S_m(k,ℓ)"
    authors: ["Adam McKenna"]
    id: "McKenna 2026 (this project's paper; paper/modular-schur.pdf)"
    type: "original-proof"
    location: "Theorem 1.2 and its accompanying Lean formalization"
    relationship: "other"
    note: >
      First presentation of the uniform result by this formalization and its
      accompanying project writeup. Theorem 1.2 is the headline
      machine-verified result; it subsumes and extends the two prior
      per-modulus sources below.
  - title: "Modular Schur numbers"
    authors: ["Jonathan Chappelon", "María Pastora Revuelta Marchena", "María Isabel Sanz Domínguez"]
    id: "Electron. J. Combin. 20(2) (2013) #P61; arXiv:1306.5635"
    type: "article"
    relationship: "background"
    note: >
      Introduced S_m(k,ℓ); closed m ∈ {1,2,3}. Universal upper bound
      S_m(k,ℓ) ≤ m-1 (Lemma 2.2 here). Checked against the published text
      (Electron. J. Combin. 20(2) (2013) #P61, DOI 10.37236/2374) on 2026-08-24:
      authors, venue, and these three content claims match; a copy is archived at
      docs/references/chappelon-etal-2013.pdf (gitignored, SHA-256 in the
      reference note). See docs/references/.
  - title: "Modular generalizations of Schur numbers"
    authors: ["J. D'orville", "K. A. Sim", "K. B. Wong", "C. K. Ho"]
    id: "Integers 25 (2025) #A62"
    type: "article"
    relationship: "background"
    note: >
      Closed m ∈ {4,5,6,7} by residue case analysis; posed the m ≥ 8 case as
      Problem 1.5. Their Problem 1.3 (the k=1 value) is resolved here as
      schurModResidue_k1 = min(ℓ-1, ⌊m/ℓ⌋) for 2 ≤ m, 2 ≤ ℓ ≤ m. Authors, title,
      venue, the m ∈ {4,5,6,7} closure, Theorem 9 (the m = 5 values), Corollary 8
      (prime moduli), and the Problem 1 part numbering were checked against the
      published version (https://math.colgate.edu/~integers/z62/z62.pdf) on
      2026-08-24; a copy is archived at docs/references/dorville-etal-2025.pdf
      (gitignored, SHA-256 in the reference note). See docs/references/.

# project status
status:
  scope: >
    Structural theory of the modular Schur number S_m(k,ℓ) plus computational
    scans. The STRUCTURAL closed-form proof (the paper) is mathlib-only, sorry-free,
    and kernel-axiom-clean (no project axioms, no native_decide): 12 headline
    theorems are packaged for the leanprover/comparator gate (see lean/comparator/).
    The public repository also distributes a separate 27-module hand-written,
    generated-independent project layer, including the exact seed-count,
    stable-prime residual transport, recurrence, prime-power, and unrestricted
    exponent-truncation capstones. Those declarations are built and axiom-audited
    but are not among the 12 comparator entries. A separate, EARLIER generated
    computational scan tree remains private and verifies per-modulus tables via
    native_decide; it is not part of the public release or comparator gate. Its
    closure includes a generated per-computation native-evaluation axiom named
    like declaration._native.native_decide.ax_*. See LEAN_STATUS.md and
    lean/comparator/README.md.
  sorry_count: 0                # the 27 public project modules are sorry-free; Challenge.lean's 12 statement stubs are intentional and discharged by Solution.lean
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]   # verified axiom closure of all 12 comparator headline results
  axioms_note: >
    Verified via `#print axioms` on each of the 12 Headline theorems
    (lean/comparator/axiom-audit.lean): closure is exactly {propext,
    Classical.choice, Quot.sound}: no sorryAx, no custom axioms, no
    generated native-evaluation axiom. The public 27-module project allowlist
    has a separate named-capstone audit in
    lean/ModularSchur/PublicAxiomAudit.lean and contains no native_decide.
    First measured 2026-06-20 and independently confirmed against
    permitted_axioms by the comparator itself in CI. The expanded public
    release passed both comparator jobs in run 33297349901 at commit
    6fcb3470d0f22776694bd44ee2a28c87184b953d on 2026-08-30.
  main_results:
  - declaration: "Headline.schurMod_eq"
    file: "lean/comparator/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "lean/comparator/config.json"
    note: "Theorem 1.2 in the Mathlib-only comparator surface; the same config checks 12 headline declarations."
  - declaration: "Headline.schurModResidue_k1"
    file: "lean/comparator/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "lean/comparator/config.json"
    note: "Resolves D'orville–Sim–Wong–Ho Problem 1.3; the cited problem is provenance, not an assumed result."
  - declaration: "ModularSchur.CanonicalBlocks.axisCover_canonicalExtensionalFamily_eq_seedCountFormula_add_residual"
    file: "lean/ModularSchur/CanonicalSeedCount.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    note: "Project-only, independently audited exact support-one seed count and residual decomposition; not comparator-configured."
  - declaration: "ModularSchur.CanonicalBlocks.axisCover_canonicalExtensionalFamily_mul_prime_eq"
    file: "lean/ModularSchur/CanonicalResidualCoverTransport.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    note: "Project-only, independently audited one-step stable-prime recurrence; not comparator-configured."
  - declaration: "ModularSchur.CanonicalBlocks.axisCover_canonicalExtensionalFamily_eq_exponentTruncatedCore_add_excess_unrestricted"
    file: "lean/ModularSchur/CanonicalCriticalCore.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    note: "Project-only, independently audited unrestricted critical-core reduction; not comparator-configured."

