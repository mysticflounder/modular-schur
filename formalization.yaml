# fidelity
fidelity:
  divergences: >
    The comparator gate covers the 12 mathlib-statable, kernel-axiom-clean
    STRUCTURAL results. To state them with mathlib definitions alone, the project's
    validity-partition structures (IsValidPartition / IsValidPartitionNat) are
    unbundled into their four fields, and schurMod / schurModResidue are spelled out
    as the full Nat.findGreatest expression (see lean/comparator/Challenge.lean and
    the two bridge lemmas in Solution.lean). The 27-module project-only public
    layer is separately built and axiom-audited but not statement-compared by
    the gate. The earlier native_decide-backed per-modulus scan tree
    (`lean/ModularSchur/Generated/` and generated-dependent concrete bridges)
    remains private, is deliberately left out of the gate, and is not
    kernel-axiom-clean. See LEAN_STATUS.md and lean/comparator/README.md.

# review status
review:
  status: "self-assessed"                            # [required] comparator gate green on a runner; no external human peer review yet
  reviewers: []
  notes: >
    Self-audit: lean/comparator/check-conformance.sh builds Challenge + Solution and
    checks no Headline theorem depends on sorryAx or native evaluation
    (including generated names like declaration._native.native_decide.ax_*).
    It is a blocklist, not a whitelist; a project-defined axiom would pass it.
    lean/comparator/axiom-audit.lean prints the #print axioms closure for all 12
    without asserting anything about it. The authoritative external check is a
    leanprover/comparator run that verifies statement identity and axiom compliance and
    re-runs the nanoda + Lean default kernels (CI:
    .github/workflows/comparator.yml). The expanded public release passed both
    jobs in run 33297349901 at commit
    6fcb3470d0f22776694bd44ee2a28c87184b953d on 2026-08-30, covering
    statement identity for all 12, axiom-closure compliance, and replay through
    both kernels. The job is blocking. This remains "self-assessed" because no
    external human peer review has taken place; the comparator is a tool, not a
    reviewer.

# editorial_review - material for Palomar Registry editorial review.
editorial_review:

  # A plain-language account of each of the 12 theorems the comparator checks.
  # Throughout, n := m/gcd(m, l-1), and a class is "l-sum-free mod m" when no l
  # of its elements (repeats allowed) sum to an element of that same class mod m.
  compared_theorems:
    - name: "Headline.schurMod_eq"
      plain: >
        The main result, stated over the natural numbers. Once you have at least
        n-1 colours, the largest N whose colouring can succeed is exactly n-1.
        One formula covers every modulus and every length.
    - name: "Headline.schurMod_is_greatest"
      plain: >
        A soundness check on the formal definition rather than a mathematical
        step. Any N that admits a valid partition is at most the value the
        definition computes. With the m-1 bound below, this shows the capped
        search really does compute the unbounded "greatest N" of the paper's
        definition, and not some weaker capped quantity.
    - name: "Headline.no_valid_partition_of_ge_m"
      plain: >
        Nothing survives at or beyond N = m. Whichever class contains m fails
        immediately, because l copies of m sum to 0, which is m itself modulo m.
        This is what makes the capped search lossless.
    - name: "Headline.schurMod_eq_schurModResidue"
      plain: >
        Working with integers and working with residues give the same number.
        This licences the rest of the development to argue inside Z/m.
    - name: "Headline.schurModResidue_eq"
      plain: >
        The main result again, stated over residues. It is the conjunction of the
        upper and lower bounds that follow.
    - name: "Headline.schurModResidue_le"
      plain: >
        The upper bound. The value is at most n-1, because the residue n cannot
        sit safely even by itself, so once N reaches n the class holding n fails.
    - name: "Headline.le_schurModResidue"
      plain: >
        The lower bound. When you have at least n-1 colours, n-1 is reachable.
        The witness is the simplest possible one: give each of 1 through n-1 its
        own colour.
    - name: "Headline.singleton_sumFree_iff"
      plain: >
        The criterion that drives both bounds. A one-element class {r} is
        l-sum-free exactly when (l-1)*r is nonzero modulo m.
    - name: "Headline.unsafe_witness_residue"
      plain: >
        The arithmetic heart of the paper. The residue n satisfies
        (l-1)*n = 0 modulo m, so l copies of n sum back to n. This is the single
        self-defeating value that forces the upper bound.
    - name: "Headline.not_sumFree_of_mem_zero"
      plain: >
        Zero is never safe: l copies of 0 sum to 0. This is why the count runs
        over 1 through N and not from 0.
    - name: "Headline.schurModResidue_k1"
      plain: >
        The one-colour case in closed form: the answer is the smaller of l-1 and
        the floor of m/l. This settles Problem 1.3 of D'orville, Sim, Wong, and
        Ho.
    - name: "Headline.sigmaInfty_le"
      plain: >
        A counting bound used in the threshold theory. If every pairwise
        difference within a set lies in a proper subgroup, the set has at most
        m/minFac(m) elements. The Lean statement carries that hypothesis
        explicitly; the paper-side bridge putting every stable safe set of
        size at least 2 under it (Theorem 8.1) is prose only, its
        formalization deferred (see lean/ModularSchur/SigmaInfty.lean).

  originality: >
    The uniform closed form S_m(k,l) = m/gcd(m,l-1) - 1 for k >= n-1 is original
    to this work. It extends the coprime case (Corollary 5 of D'orville, Sim,
    Wong, and Ho) to every gcd, and settles the large-k regime of their Problem
    1, part 5. The k=1 closed form resolves their Problem 1.3.

    Prior background is not claimed as original: the quantity S_m(k,l) is due
    to Chappelon, Revuelta Marchena, and Sanz Dominguez (2013), and the
    universal bound S_m(k,l) <= m-1 is theirs. Both are restated and reproved so
    the formal development is self-contained. The uniform closed form and this
    Lean formalization are original. The repository does not wrap or re-export
    an existing Lean development, and no prior Mathlib or community
    formalization of modular Schur numbers is known to the author.

  review_roles:
    human: >
      The author set the research direction, chose which obstruction to attack at
      each step, and accepted or rejected each result. The author did not hand-write
      the Lean proofs.
    ai: >
      The informal proofs, Lean formalization, and paper draft were produced by
      multiple AI systems under human direction. Claude through Claude Code
      contributed to the original structural development and comparator
      packaging. Aristotle filled the 10 proof bodies identified by trailers on
      commits e07bf41 and 7c56323. OpenAI Codex/GPT-5 contributed to later
      canonical project-layer work, TauClosure trust hardening, public
      dependency-audit packaging, release tooling, and documentation. Git does
      not support reliable per-file model attribution, so none is asserted
      beyond the bounded Aristotle trailers. Every published declaration is
      checked by the Lean kernel; comparator declarations are additionally
      replayed by the comparator.
    external: >
      None. No external human has peer-reviewed this work. The comparator is an
      automated gate, not a reviewer, and a green run is not a referee report.

  limitations: >
    Scope of the gate. The 12 theorems above are the whole comparator-checked
    claim. The public repository also carries project-only kernel proofs listed
    in LEAN_STATUS.md; those have a separate capstone axiom audit and no
    statement-comparison claim. The project also contains an earlier
    computational route, a generated tree of roughly 7,500 Lean files that
    decides per-modulus tables with native_decide. That tree is excluded from
    the gate, is not exported to the public repository, and is not part of any
    verification claim here: its axiom closure carries a generated
    per-computation native-evaluation axiom named like
    declaration._native.native_decide.ax_*, which trusts the compiler rather
    than the kernel.

    Statement shape. To state the results using Mathlib definitions alone, the
    project's bundled partition structures are unbundled into their four fields,
    and the Schur numbers are spelled out as explicit Nat.findGreatest
    expressions. Two private bridge lemmas in Solution.lean reconcile the two
    spellings. They are the only load-bearing glue between the audited statements
    and the project development, and a reviewer should read them first.

    What is not proved. The threshold k_0(m,l) is not settled in general. Two
    natural conjectures about it are refuted, one at m=12 for every l congruent
    to 11 mod 12, and one at m=16. The computational frontier programme
    establishes k_0 row by row out to m <= 5500 without yielding a closed form
    for gcd(m,l-1) > 1. Those frontier results rest on solver certificates and
    have not been run through the axiom audit.

    Metadata. Both cited sources were checked against their published versions
    on 2026-08-24; copies are archived under docs/references/ (gitignored PDFs,
    SHA-256 recorded in the reference notes). Cost, wall time, and
    token totals were not logged during the work and are recorded as
    "not recorded" rather than estimated.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "ModularSchur (project); Headline (comparator restatements)"
  statements:
    - source: "Theorem 1.2: S_m(k,ℓ) = m/gcd(m,ℓ-1) - 1 for m≥2, ℓ≥2, k ≥ n-1"
      lean: "ModularSchur.schurMod_eq"
      module: "ModularSchur.IntegerBridge"
      status: "proved"
    - source: "Lemma 2.1: residue reduction (integer S_m = residue S_m for N ≤ m-1)"
      lean: "ModularSchur.schurMod_eq_schurModResidue"
      module: "ModularSchur.IntegerBridge"
      status: "proved"
    - source: "Lemma 2.2: universal upper bound S_m(k,ℓ) ≤ m-1"
      lean: "ModularSchur.no_valid_partition_of_ge_m"
      module: "ModularSchur.IntegerBridge"
      status: "proved"
    - source: "Lemma 2.3: singleton {r} is ℓ-sum-free iff (ℓ-1)·r ≠ 0"
      lean: "ModularSchur.singleton_sumFree_iff"
      module: "ModularSchur.SingletonSafety"
      status: "proved"
    - source: "Theorem 3.1 (upper) and Theorem 4.1 (lower), residue form"
      lean: "ModularSchur.schurModResidue_le / ModularSchur.le_schurModResidue / ModularSchur.schurModResidue_eq"
      module: "ModularSchur.Partition"
      status: "proved"
    - source: "D'orville–Sim–Wong–Ho Problem 1.3 (k=1): S_m(1,ℓ) = min(ℓ-1, ⌊m/ℓ⌋) for 2 ≤ m, 2 ≤ ℓ ≤ m"
      lean: "ModularSchur.schurModResidue_k1"
      module: "ModularSchur.K1Theorem"
      status: "proved"

