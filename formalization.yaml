acknowledgements: >
  Built on mathlib4 (leanprover-community) and Lean 4. The paper was written
  collaboratively with Claude (Anthropic); the Lean 4 proofs were machine-verified
  by Aristotle (Harmonic) [Achim et al. 2025]. Auditability packaging follows the
