# formalization.yaml (v0.3): repo-root metadata for formalization projects.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Cost and token totals were not logged during the work and are recorded as
# "not recorded" rather than estimated.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "schur-numbers"                              # [required]
  authors: ["Adam McKenna"]                          # [required]
  license: "Apache-2.0"                              # [required]
  repo: "https://github.com/mysticflounder/modular-schur"   # [required] canonical PUBLIC repo, and the Palomar submission target
  private_repo: "https://github.com/flound1129/schur-numbers"  # the working repo; the public tree is a curated export of it

  # Palomar submission is NOT YET COMPLETE. Select and submit an immutable
  # 40-character public commit SHA only after the candidate commit exists and
  # its current registry-layout and CI checks pass. A snapshot cannot reliably
  # name its own Git object, so the selected SHA belongs in the submission
  # record and release handoff rather than this file.
  # Palomar Registry submission fields.
  # The arXiv categories and MSC2020 codes below were confirmed by the author
  # on 2026-08-24.
  arxiv_categories: ["math.CO", "math.NT"]           # [required] 1-2 categories
  msc2020: ["05D10", "11B13", "11B75", "68V20"]      # [required] 1-8 codes
  originality: "original"        # [required] original result, not a formalization of a third-party paper
  development_kind: "substantive"  # [required] substantive development, not a thin wrapper
  comparator_config_path: "lean/comparator/config.json"  # non-default name; conventionally comparator.json
  project_path: "lean"           # non-default layout: the Lake project is in lean/, not at the repo root

# sources - what was formalized / extended.
sources:                                             # [required]
  - title: "A uniform closed form for modular Schur numbers S_m(k,ℓ)"
    authors: ["Adam McKenna"]
    id: "McKenna 2026 (this project's paper; paper/modular-schur.pdf)"
    type: "preprint"
    note: >
      The project's own writeup. Theorem 1.2 (the uniform closed form
      S_m(k,ℓ) = m/gcd(m,ℓ-1) - 1 for k ≥ n-1) is the headline machine-verified
      result; it subsumes and extends the two prior per-modulus sources below.
  - title: "Modular Schur numbers"
    authors: ["Jonathan Chappelon", "María Pastora Revuelta Marchena", "María Isabel Sanz Domínguez"]
    id: "Electron. J. Combin. 20(2) (2013) #P61; arXiv:1306.5635"
    type: "article"
    note: >
      Introduced S_m(k,ℓ); closed m ∈ {1,2,3}. Universal upper bound
      S_m(k,ℓ) ≤ m-1 (Lemma 2.2 here). Checked against the published text
      (Electron. J. Combin. 20(2) (2013) #P61, DOI 10.37236/2374) on 2026-08-24:
      authors, venue, and these three content claims match; a copy is archived at
      docs/references/chappelon-etal-2013.pdf (gitignored, SHA-256 in the
      reference note). See docs/references/.
  - title: "Modular generalizations of Schur numbers"
    authors: ["J. D'orville", "K. A. Sim", "K. B. Wong", "C. K. Ho"]
    id: "Integers 25 (2025) #A62"
    type: "article"
    note: >
      Closed m ∈ {4,5,6,7} by residue case analysis; posed the m ≥ 8 case as
      Problem 1.5. Their Problem 1.3 (the k=1 value) is resolved here as
      schurModResidue_k1 = min(ℓ-1, ⌊m/ℓ⌋) for 2 ≤ m, 2 ≤ ℓ ≤ m. Authors, title,
      venue, the m ∈ {4,5,6,7} closure, Theorem 9 (the m = 5 values), Corollary 8
      (prime moduli), and the Problem 1 part numbering were checked against the
      published version (https://math.colgate.edu/~integers/z62/z62.pdf) on
      2026-08-24; a copy is archived at docs/references/dorville-etal-2025.pdf
      (gitignored, SHA-256 in the reference note). See docs/references/.

# project status
status:
  scope: >
    Structural theory of the modular Schur number S_m(k,ℓ) plus computational
    scans. The STRUCTURAL closed-form proof (the paper) is mathlib-only, sorry-free,
    and kernel-axiom-clean (no project axioms, no native_decide): 12 headline
    theorems are packaged for the leanprover/comparator gate (see lean/comparator/).
    The public repository also distributes a separate 27-module hand-written,
    generated-independent project layer, including the exact seed-count,
    stable-prime residual transport, recurrence, prime-power, and unrestricted
    exponent-truncation capstones. Those declarations are built and axiom-audited
    but are not among the 12 comparator entries. A separate, EARLIER generated
    computational scan tree remains private and verifies per-modulus tables via
    native_decide; it is not part of the public release or comparator gate. Its
    closure includes a generated per-computation native-evaluation axiom named
    like declaration._native.native_decide.ax_*. See LEAN_STATUS.md and
    lean/comparator/README.md.
  sorry_count: 0                # the 27 public project modules are sorry-free; Challenge.lean's 12 statement stubs are intentional and discharged by Solution.lean
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]   # verified axiom closure of all 12 comparator headline results
  axioms_note: >
    Verified via `#print axioms` on each of the 12 Headline theorems
    (lean/comparator/axiom-audit.lean): closure is exactly {propext,
    Classical.choice, Quot.sound}: no sorryAx, no custom axioms, no
    generated native-evaluation axiom. The public 27-module project allowlist
    has a separate named-capstone audit in
    lean/ModularSchur/PublicAxiomAudit.lean and contains no native_decide.
    First measured 2026-06-20; re-checked on every CI run since, and
    independently confirmed against permitted_axioms by the comparator itself
    in CI (first public green run 30211804373, 2026-07-26; pre-expansion
    baseline run 32795126047, commit bae075f, 2026-08-25).
  main_results:
  - declaration: "lean/comparator/config.json theorem_names (12 mathlib-only structural headline claims)"
    file: "lean/comparator/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "lean/comparator/config.json"
  - declaration: "ModularSchur.schurMod_eq"
    file: "lean/ModularSchur/IntegerBridge.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "lean/comparator/config.json"
    note: "Theorem 1.2: S_m(k,ℓ) = m/gcd(m,ℓ-1) - 1 for k ≥ n-1, integer (Definition 1.1) form."
  - declaration: "ModularSchur.schurModResidue_k1"
    file: "lean/ModularSchur/K1Theorem.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "lean/comparator/config.json"
    literature_dependencies: ["D'orville–Sim–Wong–Ho, Integers 25 (2025) #A62, Problem 1.3"]
  - declaration: "ModularSchur.CanonicalBlocks.axisCover_canonicalExtensionalFamily_eq_seedCountFormula_add_residual"
    file: "lean/ModularSchur/CanonicalSeedCount.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    note: "Project-only, independently audited exact support-one seed count and residual decomposition; not comparator-configured."
  - declaration: "ModularSchur.CanonicalBlocks.axisCover_canonicalExtensionalFamily_mul_prime_eq"
    file: "lean/ModularSchur/CanonicalResidualCoverTransport.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    note: "Project-only, independently audited one-step stable-prime recurrence; not comparator-configured."
  - declaration: "ModularSchur.CanonicalBlocks.axisCover_canonicalExtensionalFamily_eq_exponentTruncatedCore_add_excess_unrestricted"
    file: "lean/ModularSchur/CanonicalCriticalCore.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    note: "Project-only, independently audited unrestricted critical-core reduction; not comparator-configured."

# how it was produced.
# The token counts and spend below were never logged and are recorded as "not
# recorded". Two AI systems worked on the Lean tree, and the split is recorded
# from the Git trailers: Claude (Anthropic), driven through Claude Code, wrote
# every definition, every theorem statement, the IntegerBridge and K1Theorem
# modules and the whole comparator layer; Aristotle (Harmonic)
# [Achim et al. 2025] filled the proof bodies of 10 lemmas in seven modules on
# 2026-04-16 (commits e07bf41 and 7c56323, the only two that carry an Aristotle
# trailer). Fill the cost/token fields from the actual logs before posting.
automation:                                          # [required]
  methods:
    - method: "agent"                                # AI agents under human direction
      models: ["claude-opus-4-8"]                   # principal model; the exact set across all sessions was not logged
      framework: "Claude Code"
      tool_setup: >
        Claude Code CLI with project skills/hooks (persistent memory, Lean build
        wrapper with memory/priority caps, doc-check hook). The informal proofs,
        formalization, and paper draft were iterated together over several sessions.
      cost:
        wall_time: "not recorded"
        spend_usd: "not recorded"
        hardware: "API-only / local laptop (no GPU)"
        tokens: "not recorded"
      prompting_notes: >
        Math-proofs working style: hardest sub-obstruction first; neutral obstruction
        names; axiom hygiene gated at every checkpoint.
    - method: "automated_theorem_prover"
      models: ["Aristotle (Harmonic)"]              # per the paper acknowledgments [Achim et al. 2025, arXiv:2510.01346]
      framework: "Aristotle / Harmonic"
      tool_setup: >
        Aristotle filled the proof bodies of 10 lemmas whose statements were
        already written, across ModularSchur.SingletonSafety, UniversalBound,
        UnifiedValue, UnifiedTheorem, Partition, SigmaInfty and StableRange.
        It did not write the definitions, the statements, the IntegerBridge or
        K1Theorem modules, or the comparator layer.
      cost:
        wall_time: "not recorded"
        spend_usd: "not recorded"
        tokens: "not recorded"
  spend_usd: "not recorded"
  notes: >
    Human-directed AI autoformalization. The structural closed-form proof is the
    paper's machine-verified content; the comparator packaging (this gate) was the
    final auditability step. Token/spend totals are not yet reconstructed.

# fidelity
fidelity:
  divergences: >
    The comparator gate covers the 12 mathlib-statable, kernel-axiom-clean
    STRUCTURAL results. To state them with mathlib definitions alone, the project's
    validity-partition structures (IsValidPartition / IsValidPartitionNat) are
    unbundled into their four fields, and schurMod / schurModResidue are spelled out
    as the full Nat.findGreatest expression (see lean/comparator/Challenge.lean and
    the two bridge lemmas in Solution.lean). The 27-module project-only public
    layer is separately built and axiom-audited but not statement-compared by
    the gate. The earlier native_decide-backed per-modulus scan tree
    (`lean/ModularSchur/Generated/` and generated-dependent concrete bridges)
    remains private, is deliberately left out of the gate, and is not
    kernel-axiom-clean. See LEAN_STATUS.md and lean/comparator/README.md.

# review status
review:
  status: "self-assessed"                            # [required] comparator gate green on a runner; no external human peer review yet
  reviewers: []
  notes: >
    Self-audit: lean/comparator/check-conformance.sh builds Challenge + Solution and
    checks no Headline theorem depends on sorryAx or native evaluation
    (including generated names like declaration._native.native_decide.ax_*).
    It is a blocklist, not a whitelist; a project-defined axiom would pass it.
    lean/comparator/axiom-audit.lean prints the #print axioms closure for all 12
    without asserting anything about it. The authoritative external check is a
    leanprover/comparator run that verifies statement identity and axiom compliance and
    re-runs the nanoda + Lean default kernels (CI:
    .github/workflows/comparator.yml). That check is GREEN on a runner: the
    pre-expansion public run 32795126047 (commit bae075f, 2026-08-25) succeeded on both jobs,
    covering statement identity for all 12, axiom-closure compliance, and replay
    through both kernels; the first public green run was 30211804373 (2026-07-26). The
    job is blocking. Still "self-assessed" because no external human peer review has
    taken place; the comparator is a tool, not a reviewer.

# editorial_review - material for Palomar Registry editorial review.
editorial_review:

  # A plain-language account of each of the 12 theorems the comparator checks.
  # Throughout, n := m/gcd(m, l-1), and a class is "l-sum-free mod m" when no l
  # of its elements (repeats allowed) sum to an element of that same class mod m.
  compared_theorems:
    - name: "Headline.schurMod_eq"
      plain: >
        The main result, stated over the natural numbers. Once you have at least
        n-1 colours, the largest N whose colouring can succeed is exactly n-1.
        One formula covers every modulus and every length.
    - name: "Headline.schurMod_is_greatest"
      plain: >
        A soundness check on the formal definition rather than a mathematical
        step. Any N that admits a valid partition is at most the value the
        definition computes. With the m-1 bound below, this shows the capped
        search really does compute the unbounded "greatest N" of the paper's
        definition, and not some weaker capped quantity.
    - name: "Headline.no_valid_partition_of_ge_m"
      plain: >
        Nothing survives at or beyond N = m. Whichever class contains m fails
        immediately, because l copies of m sum to 0, which is m itself modulo m.
        This is what makes the capped search lossless.
    - name: "Headline.schurMod_eq_schurModResidue"
      plain: >
        Working with integers and working with residues give the same number.
        This licences the rest of the development to argue inside Z/m.
    - name: "Headline.schurModResidue_eq"
      plain: >
        The main result again, stated over residues. It is the conjunction of the
        upper and lower bounds that follow.
    - name: "Headline.schurModResidue_le"
      plain: >
        The upper bound. The value is at most n-1, because the residue n cannot
        sit safely even by itself, so once N reaches n the class holding n fails.
    - name: "Headline.le_schurModResidue"
      plain: >
        The lower bound. When you have at least n-1 colours, n-1 is reachable.
        The witness is the simplest possible one: give each of 1 through n-1 its
        own colour.
    - name: "Headline.singleton_sumFree_iff"
      plain: >
        The criterion that drives both bounds. A one-element class {r} is
        l-sum-free exactly when (l-1)*r is nonzero modulo m.
    - name: "Headline.unsafe_witness_residue"
      plain: >
        The arithmetic heart of the paper. The residue n satisfies
        (l-1)*n = 0 modulo m, so l copies of n sum back to n. This is the single
        self-defeating value that forces the upper bound.
    - name: "Headline.not_sumFree_of_mem_zero"
      plain: >
        Zero is never safe: l copies of 0 sum to 0. This is why the count runs
        over 1 through N and not from 0.
    - name: "Headline.schurModResidue_k1"
      plain: >
        The one-colour case in closed form: the answer is the smaller of l-1 and
        the floor of m/l. This settles Problem 1.3 of D'orville, Sim, Wong, and
        Ho.
    - name: "Headline.sigmaInfty_le"
      plain: >
        A counting bound used in the threshold theory. If every pairwise
        difference within a set lies in a proper subgroup, the set has at most
        m/minFac(m) elements. The Lean statement carries that hypothesis
        explicitly; the paper-side bridge putting every stable safe set of
        size at least 2 under it (Theorem 8.1) is prose only, its
        formalization deferred (see lean/ModularSchur/SigmaInfty.lean).

  originality: >
    The uniform closed form S_m(k,l) = m/gcd(m,l-1) - 1 for k >= n-1 is original
    to this work. It extends the coprime case (Corollary 5 of D'orville, Sim,
    Wong, and Ho) to every gcd, and settles the large-k regime of their Problem
    1, part 5. The k=1 closed form resolves their Problem 1.3.

    Not original, and not claimed as such: the quantity S_m(k,l) itself is due to
    Chappelon, Revuelta Marchena, and Sanz Dominguez (2013), and the universal
    bound S_m(k,l) <= m-1 is theirs. Both are restated and reproved here so the
    formal development is self-contained.

    The formalization is original. It does not wrap or re-export an existing Lean
    development, and no prior Mathlib or community formalization of modular Schur
    numbers is known to the author.

  review_roles:
    human: >
      The author set the research direction, chose which obstruction to attack at
      each step, and accepted or rejected each result. The author did not hand-write
      the Lean proofs.
    ai: >
      The informal proofs, the Lean formalization, and the paper draft were produced
      by AI agents under human direction over several sessions. Two systems worked
      on the Lean tree. Claude (Anthropic), driven through Claude Code, wrote every
      definition and every theorem statement, the IntegerBridge and K1Theorem
      modules, and the comparator layer that restates the results with Mathlib
      definitions alone. Aristotle (Harmonic) filled the proof bodies of 10 lemmas
      in seven modules. Of the 12 theorems in the gate, Aristotle supplied the
      proofs behind seven (schurModResidue_eq, schurModResidue_le,
      le_schurModResidue, singleton_sumFree_iff, unsafe_witness_residue,
      not_sumFree_of_mem_zero, sigmaInfty_le); the remaining five (schurMod_eq,
      schurMod_is_greatest, no_valid_partition_of_ge_m,
      schurMod_eq_schurModResidue, schurModResidue_k1) were proved in
      Claude-written modules. Every proof, from either system, is checked by the
      Lean 4 kernel and replayed by the comparator.
    external: >
      None. No external human has peer-reviewed this work. The comparator is an
      automated gate, not a reviewer, and a green run is not a referee report.

  limitations: >
    Scope of the gate. The 12 theorems above are the whole comparator-checked
    claim. The public repository also carries project-only kernel proofs listed
    in LEAN_STATUS.md; those have a separate capstone axiom audit and no
    statement-comparison claim. The project also contains an earlier
    computational route, a generated tree of roughly 7,500 Lean files that
    decides per-modulus tables with native_decide. That tree is excluded from
    the gate, is not exported to the public repository, and is not part of any
    verification claim here: its axiom closure carries a generated
    per-computation native-evaluation axiom named like
    declaration._native.native_decide.ax_*, which trusts the compiler rather
    than the kernel.

    Statement shape. To state the results using Mathlib definitions alone, the
    project's bundled partition structures are unbundled into their four fields,
    and the Schur numbers are spelled out as explicit Nat.findGreatest
    expressions. Two private bridge lemmas in Solution.lean reconcile the two
    spellings. They are the only load-bearing glue between the audited statements
    and the project development, and a reviewer should read them first.

    What is not proved. The threshold k_0(m,l) is not settled in general. Two
    natural conjectures about it are refuted, one at m=12 for every l congruent
    to 11 mod 12, and one at m=16. The computational frontier programme
    establishes k_0 row by row out to m <= 5500 without yielding a closed form
    for gcd(m,l-1) > 1. Those frontier results rest on solver certificates and
    have not been run through the axiom audit.

    Metadata. Both cited sources were checked against their published versions
    on 2026-08-24; copies are archived under docs/references/ (gitignored PDFs,
    SHA-256 recorded in the reference notes). Cost, wall time, and
    token totals were not logged during the work and are recorded as
    "not recorded" rather than estimated.

# alignment - source statements ↦ formal declarations.
alignment:
  namespace: "ModularSchur (project); Headline (comparator restatements)"
  statements:
    - source: "Theorem 1.2: S_m(k,ℓ) = m/gcd(m,ℓ-1) - 1 for m≥2, ℓ≥2, k ≥ n-1"
      lean: "ModularSchur.schurMod_eq"
      module: "ModularSchur.IntegerBridge"
      status: "proved"
    - source: "Lemma 2.1: residue reduction (integer S_m = residue S_m for N ≤ m-1)"
      lean: "ModularSchur.schurMod_eq_schurModResidue"
      module: "ModularSchur.IntegerBridge"
      status: "proved"
    - source: "Lemma 2.2: universal upper bound S_m(k,ℓ) ≤ m-1"
      lean: "ModularSchur.no_valid_partition_of_ge_m"
      module: "ModularSchur.IntegerBridge"
      status: "proved"
    - source: "Lemma 2.3: singleton {r} is ℓ-sum-free iff (ℓ-1)·r ≠ 0"
      lean: "ModularSchur.singleton_sumFree_iff"
      module: "ModularSchur.SingletonSafety"
      status: "proved"
    - source: "Theorem 3.1 (upper) and Theorem 4.1 (lower), residue form"
      lean: "ModularSchur.schurModResidue_le / ModularSchur.le_schurModResidue / ModularSchur.schurModResidue_eq"
      module: "ModularSchur.Partition"
      status: "proved"
    - source: "D'orville–Sim–Wong–Ho Problem 1.3 (k=1): S_m(1,ℓ) = min(ℓ-1, ⌊m/ℓ⌋) for 2 ≤ m, 2 ≤ ℓ ≤ m"
      lean: "ModularSchur.schurModResidue_k1"
      module: "ModularSchur.K1Theorem"
      status: "proved"

