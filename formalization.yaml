acknowledgements: >
  Built on mathlib4 (leanprover-community) and Lean 4. The paper and the Lean
  development were written collaboratively with Claude (Anthropic); Aristotle
  (Harmonic) [Achim et al. 2025] filled the proof bodies of 10 lemmas in the
