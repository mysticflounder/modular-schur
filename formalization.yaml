# formalization.yaml (v0.3): repo-root metadata for formalization projects.
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.
#
# Cost and token totals were not logged during the work and are recorded as
# "not recorded" rather than estimated.

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "schur-numbers"                              # [required]
  authors: ["Adam McKenna"]                          # [required]
  license: "Apache-2.0"                              # [required]
  repo: "https://github.com/mysticflounder/modular-schur"   # [required] canonical PUBLIC repo, and the Palomar submission target
  private_repo: "https://github.com/flound1129/schur-numbers"  # the working repo; the public tree is a curated export of it

  # Palomar Registry submission fields.
  # NOTE: the arXiv category and MSC2020 codes below are proposed, not confirmed
  # by the author. Confirm them before submitting.
  arxiv_categories: ["math.CO", "math.NT"]           # [required] 1-2 categories
  msc2020: ["05D10", "11B13", "11B75", "68V20"]      # [required] 1-8 codes
  originality: "original"        # [required] original result, not a formalization of a third-party paper
  development_kind: "substantive"  # [required] substantive development, not a thin wrapper
  comparator_config_path: "lean/comparator/config.json"  # non-default name; conventionally comparator.json
  project_path: "lean"           # non-default layout: the Lake project is in lean/, not at the repo root

# sources - what was formalized / extended.
sources:                                             # [required]
  - title: "A uniform closed form for modular Schur numbers S_m(k,ℓ)"
    authors: ["Adam McKenna"]
    id: "McKenna 2026 (this project's paper; paper/modular-schur.pdf)"
    type: "preprint"
    note: >
      The project's own writeup. Theorem 1.2 (the uniform closed form
      S_m(k,ℓ) = m/gcd(m,ℓ-1) - 1 for k ≥ n-1) is the headline machine-verified
      result; it subsumes and extends the two prior per-modulus sources below.
  - title: "Modular Schur numbers"
    authors: ["Jonathan Chappelon", "Manuel P. Revuelta Marchena", "María I. Sanz Domínguez"]
    id: "Electron. J. Combin. 20(2) (2013) #P61; arXiv:1306.5635"
    type: "article"
    note: >
      Introduced S_m(k,ℓ); closed m ∈ {1,2,3}. Universal upper bound
      S_m(k,ℓ) ≤ m-1 (Lemma 2.2 here). Partially verified: the arXiv ID resolves
      to a paper with this title, but no local copy exists, so the author list,
      the journal reference, and these three content claims are unchecked
      against the source. See docs/references/.
  - title: "Modular generalizations of Schur numbers"
    authors: ["J. D'orville", "K. A. Sim", "K. B. Wong", "C. K. Ho"]
    id: "Integers 25 (2025) #A62"
    type: "article"
    note: >
      Closed m ∈ {4,5,6,7} by residue case analysis; posed the m ≥ 8 case as
      Problem 1.5. Their Problem 1.3 (the k=1 value) is resolved here as
      schurModResidue_k1 = min(ℓ-1, ⌊m/ℓ⌋) for 2 ≤ m, 2 ≤ ℓ ≤ m. Metadata unverified against the
      source: no local copy exists, and the open-problem numbering rests on
      project records of correspondence with the first author rather than on a
      reading of the paper. See docs/references/.

# project status
status:
  scope: >
    Structural theory of the modular Schur number S_m(k,ℓ) plus computational
    scans. The STRUCTURAL closed-form proof (the paper) is mathlib-only, sorry-free,
    and kernel-axiom-clean (no project axioms, no native_decide): 12 headline
    theorems are packaged for the leanprover/comparator gate (see lean/comparator/).
    A separate, EARLIER computational scan tree (lean/ModularSchur/Generated/ and the
    residue-axis / deficit-growth / scanner-bridge machinery) verifies per-modulus
    tables via native_decide; it is subsumed by the structural proof and is NOT part
    of the comparator gate (its axiom closure includes Lean.ofReduceBool). See
    lean/comparator/README.md "audit boundary".
  sorry_count: 0                # structural modules imported by Solution.lean are sorry-free; Challenge.lean's 12 stubs are intentional (discharged by Solution.lean)
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]   # verified axiom closure of all 12 comparator headline results
  axioms_note: >
    Verified via `#print axioms` on each of the 12 Headline theorems
    (lean/comparator/axiom-audit.lean): closure is exactly {propext,
    Classical.choice, Quot.sound} — no sorryAx, no custom axioms, no
    Lean.ofReduceBool. native_decide appears ONLY in the excluded scan tree.
    First measured 2026-06-20; re-checked on every CI run since, and
    independently confirmed against permitted_axioms by the comparator itself
    in run 30218964742 (2026-07-26).
  main_results:
  - declaration: "lean/comparator/config.json theorem_names (12 mathlib-only structural headline claims)"
    file: "lean/comparator/Solution.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "lean/comparator/config.json"
  - declaration: "ModularSchur.schurMod_eq"
    file: "lean/ModularSchur/IntegerBridge.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "lean/comparator/config.json"
    note: "Theorem 1.2: S_m(k,ℓ) = m/gcd(m,ℓ-1) - 1 for k ≥ n-1, integer (Definition 1.1) form."
  - declaration: "ModularSchur.schurModResidue_k1"
    file: "lean/ModularSchur/K1Theorem.lean"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "lean/comparator/config.json"
    literature_dependencies: ["D'orville–Sim–Wong–Ho, Integers 25 (2025) #A62, Problem 1.3"]

